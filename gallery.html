<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="photo.ico" type="image/x-icon" width="144" height="256">
    <title>Фотогаллерея</title>
    <link rel="preload" href="css/main.css" as="style" onload="this.rel = 'stylesheet'">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background-color: #000;
            color: #fff;
            -ms-user-select: none; 
            -moz-user-select: none; 
            -webkit-user-select: none; 
            user-select: none; 
        }
        .navbar {
            background: linear-gradient(90deg, #000, #ff6600);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
        }
        .nav-container {
            display: flex;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
            text-decoration: none;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: rgba(0, 0, 0, 0.7);
            color: #ff6600;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            text-decoration: none;
        }
        .nav-btn:hover {
            background: #ff6600;
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(255, 102, 0, 0.4);
            text-decoration: none;
        }
        .hero {
            text-align: center;
            padding: 30px 15px;
            background: linear-gradient(135deg, #000, #333);
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(255, 102, 0, 0.2);
        }
        .hero h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #ff6600;
            text-shadow: 0 2px 4px rgba(255, 102, 0, 0.5);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        .footer {
            text-align: center;
            padding: 0;
            margin: 20px 15px;
            border-radius: 16px;
            background: linear-gradient(145deg, #0d0d0d, #1a1a1a);
            border: 1px solid rgba(255, 102, 0, 0.25);
            box-shadow: 0 8px 32px rgba(255, 102, 0, 0.15), inset 0 1px 0 rgba(255, 102, 0, 0.1);
            overflow: hidden;
        }
        .footer-inner {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.8rem 1.8rem;
            padding: 1.8rem 2rem;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
        }
        .footer-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 0.5rem;
        }
        .footer-brand .brand-name {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6600, #ff9933);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.05em;
        }
        .footer-brand .brand-sub {
            font-size: 0.7rem;
            color: #aa7a4a;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .footer-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.5rem 1.4rem;
            padding: 0.5rem 1.4rem;
            background: rgba(255, 102, 0, 0.04);
            border-radius: 50px;
            border: 1px solid rgba(255, 102, 0, 0.08);
        }
        .footer-nav a {
            color: #cc8844;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.3rem 0.1rem;
            border-bottom: 2px solid transparent;
            transition: all 0.25s ease;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        .footer-nav a:hover {
            color: #ff9933;
            border-bottom-color: #ff6600;
            transform: translateY(-1px);
            text-shadow: 0 0 12px rgba(255, 102, 0, 0.2);
        }
        .footer-copy {
            text-align: center;
            padding: 0.9rem 1rem 0.7rem;
            border-top: 1px solid rgba(255, 102, 0, 0.08);
            font-size: 0.75rem;
            color: #663311;
            letter-spacing: 0.05em;
            background: rgba(0, 0, 0, 0.2);
        }
        .footer-copy span {
            color: #884422;
        }
        @media (max-width: 700px) {
            .footer-inner {
                flex-direction: column;
                gap: 0.8rem;
                padding: 1.2rem 1rem;
            }
            .footer-brand {
                margin-right: 0;
            }
            .footer-nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.4rem 1rem;
                padding: 0.5rem 1rem;
                border-radius: 30px;
                width: 100%;
            }
            .footer-nav a {
                font-size: 0.9rem;
                white-space: nowrap;
            }
            .footer-copy {
                font-size: 0.65rem;
                padding: 0.6rem 0.5rem 0.5rem;
            }
        }
        @media (max-width: 450px) {
            .footer-nav a {
                font-size: 0.8rem;
            }
        }
        .ssilka {
            display: none;
        }
        .silk {
            display: none;
        }
        .meow {
            display: none;
        }
        .photos {
            padding: 20px 10px;
            background: linear-gradient(135deg, #000, #333);
            margin: 0 15px 20px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(255, 102, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .photos img {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            border-radius: 5px;
        }

        @media (min-width: 768px) {
            .nav-container {
                flex-wrap: nowrap;
            }
            .nav-btn {
                padding: 10px 20px;
                margin: 0 10px;
            }
            .hero {
                padding: 60px 20px;
                margin-bottom: 40px;
            }
            .hero h1 {
                font-size: 48px;
                margin-bottom: 20px;
            }
            .footer {
                margin: 40px 150px;
            }
            .photos {
                padding: 60px 20px;
                margin: 0 150px 40px;
                display: block;
                text-align: center;
            }
            .photos img {
                width: 570px;
                height: 320px;
                margin: 25px;
                display: inline-block;
            }
        }
    </style>
</head>
