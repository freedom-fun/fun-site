<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="preload" href="css/main.css" as="style" fetchpriority="high" onload="this.rel = 'stylesheet'">
    <link rel="preload" href="css/vote_widget.css" as="style" onload="this.rel = 'stylesheet'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="photo.ico" type="image/x-icon" width="144" height="256">
    <title>Онлайн</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Arial', sans-serif;
        }
        body {
            background-color: #0a1a2b;
            color: #e8d5b5;
            -ms-user-select: none; 
            -moz-user-select: none; 
            -webkit-user-select: none; 
            user-select: none;
        }
        .navbar {
            background: linear-gradient(90deg, #0a1a2b, #9f6b3a);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 12px rgba(159, 107, 58, 0.4);
        }
        .nav-container {
            display: flex;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
            text-decoration: none;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: rgba(10, 26, 43, 0.8);
            color: #c69c6d;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 0.03em;
        }
        .nav-btn:hover {
            background: #9f6b3a;
            color: #0a1a2b;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(159, 107, 58, 0.5);
            text-decoration: none;
        }
        .hero {
            text-align: center;
            padding: 30px 15px;
            background: linear-gradient(135deg, #0a1a2b, #1d2f44);
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(159, 107, 58, 0.3);
        }
        .hero h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #c69c6d;
            text-shadow: 0 2px 4px rgba(159, 107, 58, 0.5);
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        .footer {
            text-align: center;
            padding: 0;
            margin: 20px 15px;
            border-radius: 16px;
            background: linear-gradient(145deg, #0d1f30, #1a3045);
            border: 1px solid rgba(159, 107, 58, 0.35);
            box-shadow: 0 8px 32px rgba(159, 107, 58, 0.2), inset 0 1px 0 rgba(159, 107, 58, 0.15);
            overflow: hidden;
        }
        .footer-inner {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.8rem 1.8rem;
            padding: 1.8rem 2rem;
            background: rgba(10, 26, 43, 0.4);
            backdrop-filter: blur(2px);
        }
        .footer-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 0.5rem;
        }
        .footer-brand .brand-name {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c69c6d, #e0b68a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.05em;
        }
        .footer-brand .brand-sub {
            font-size: 0.7rem;
            color: #a8855e;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.7;
            font-weight: 500;
        }
        .footer-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.5rem 1.4rem;
            padding: 0.5rem 1.4rem;
            background: rgba(159, 107, 58, 0.08);
            border-radius: 50px;
            border: 1px solid rgba(159, 107, 58, 0.15);
        }
        .footer-nav a {
            color: #b58c62;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.3rem 0.1rem;
            border-bottom: 2px solid transparent;
            transition: all 0.25s ease;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        .footer-nav a:hover {
            color: #e0b68a;
            border-bottom-color: #9f6b3a;
            transform: translateY(-1px);
            text-shadow: 0 0 12px rgba(159, 107, 58, 0.3);
        }
        .footer-copy {
            text-align: center;
            padding: 0.9rem 1rem 0.7rem;
            border-top: 1px solid rgba(159, 107, 58, 0.12);
            font-size: 0.75rem;
            color: #7a5f3e;
            letter-spacing: 0.05em;
            background: rgba(10, 26, 43, 0.3);
            font-weight: 400;
        }
        .footer-copy span {
            color: #a8855e;
        }
        @media (max-width: 700px) {
            .footer-inner {
                flex-direction: column;
                gap: 0.8rem;
                padding: 1.2rem 1rem;
            }
            .footer-brand {
                margin-right: 0;
            }
            .footer-nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.4rem 1rem;
                padding: 0.5rem 1rem;
                border-radius: 30px;
                width: 100%;
            }
            .footer-nav a {
                font-size: 0.9rem;
                white-space: nowrap;
            }
            .footer-copy {
                font-size: 0.65rem;
                padding: 0.6rem 0.5rem 0.5rem;
            }
        }
        @media (max-width: 450px) {
            .footer-nav a {
                font-size: 0.8rem;
            }
        }
        iframe {
            max-width: 100%;
        }
        .mrl-vote-server {
            display: block;
            margin: 20px auto;
        }
        .ssilka {
            display: none;
        }
        .silk {
            display: none;
        }
        .meow {
            display: none;
        }

        @media (min-width: 768px) {
            .nav-container {
                flex-wrap: nowrap;
            }
            .nav-btn {
                padding: 10px 20px;
                margin: 0 10px;
                font-size: 15px;
            }
            .hero {
                padding: 60px 20px;
                margin-bottom: 40px;
            }
            .hero h1 {
                font-size: 48px;
                margin-bottom: 20px;
            }
            .footer {
                margin: 40px 150px;
            }
        }
        .mrl-vote-server span#mrl-vote-title {
            display: inline-block;
            height: 30px;
            color: #c69c6d;
            font-weight: 600;
        }
        .mrl-vote-server span#mrl-vote-counter {
            color: #e8d5b5;
            font-weight: 500;
        }
    </style>
    <script type="text/javascript" src="js/jquery-4.0.0.min.js" defer></script>
    <script type="text/javascript" src="js/misterLauncher.js" defer></script>
</head>

        </div>
        <div class="footer-copy">
