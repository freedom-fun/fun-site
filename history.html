<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="preload" href="css/main.css" as="style" fetchpriority="high" onload="this.rel = 'stylesheet'">
    <link rel="preload" href="history.json" as="fetch" fetchpriority="high" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link rel="icon" href="photo.ico" type="image/x-icon">
    <title>История Freedom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Arial', sans-serif;
        }
        body {
            background-color: #0a1a2b;
            color: #e8d5b5;
            -ms-user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .navbar {
            background: linear-gradient(90deg, #0a1a2b, #9f6b3a);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 12px rgba(159, 107, 58, 0.4);
        }
        .nav-container {
            display: flex;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
            text-decoration: none;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: rgba(10, 26, 43, 0.8);
            color: #c69c6d;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 0.03em;
        }
        .nav-btn:hover {
            background: #9f6b3a;
            color: #0a1a2b;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(159, 107, 58, 0.5);
            text-decoration: none;
        }
        .container {
            display: flex;
            min-height: calc(100vh - 70px);
            gap: 0;
        }
        .sidebar {
            width: 200px;
            background: linear-gradient(180deg, #0d1f30, #152d42);
            border-right: 2px solid rgba(159, 107, 58, 0.3);
            flex-shrink: 0;
        }
        .tab-button {
            display: block;
            width: 100%;
            padding: 18px 10px;
            background: transparent;
            color: #b58c62;
            border: none;
            border-bottom: 1px solid rgba(159, 107, 58, 0.1);
            cursor: pointer;
            font-size: 32px;
            text-align: center;
            transition: all 0.3s ease;
            font-family: 'Rubik Mono One', monospace;
            position: relative;
        }
        .tab-button::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: #c69c6d;
            transition: height 0.3s ease;
        }
        .tab-button:hover {
            background: rgba(159, 107, 58, 0.1);
            color: #e0b68a;
        }
        .tab-button.active {
            background: rgba(159, 107, 58, 0.15);
            color: #e8d5b5;
        }
        .tab-button.active::after {
            height: 60%;
        }
        .content {
            flex: 1;
            padding: 30px 35px;
            overflow-y: auto;
            background: rgba(10, 26, 43, 0.3);
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 2px solid rgba(159, 107, 58, 0.3);
                display: flex;
                overflow-x: auto;
                background: #0d1f30;
            }
            .tab-button {
                flex-shrink: 0;
                width: auto;
                min-width: 70px;
                padding: 12px 15px;
                text-align: center;
                border-bottom: none;
                border-right: 1px solid rgba(159, 107, 58, 0.1);
                font-size: 24px;
            }
            .tab-button::after {
                display: none;
            }
            .tab-button.active {
                background: rgba(159, 107, 58, 0.2);
                border-bottom: 2px solid #c69c6d;
            }
            .content {
                padding: 20px;
            }
        }
        .epoha {
            text-align: center;
            font-family: 'Rubik Mono One', monospace;
            font-size: 2.2rem;
            margin-bottom: 8px;
            color: #e8d5b5;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 20px rgba(159, 107, 58, 0.2);
        }
        .name_epoha {
            text-align: center;
            font-family: 'Rubik Mono One', monospace;
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #b58c62;
            letter-spacing: 0.1em;
            opacity: 0.8;
            font-weight: 400;
        }
        .glava-container {
            margin-bottom: 25px;
            padding: 22px 25px;
            background: rgba(159, 107, 58, 0.06);
            border-left: 3px solid #9f6b3a;
            border-radius: 0 8px 8px 0;
            transition: all 0.3s ease;
        }
        .glava-container:hover {
            background: rgba(159, 107, 58, 0.1);
            transform: translateX(4px);
        }
        .glava-title {
            font-family: 'Rubik Mono One', monospace;
            font-size: 1.2rem;
            color: #c69c6d;
            margin-bottom: 12px;
            letter-spacing: 0.03em;
        }
        .glava-text {
            font-family: 'Inter', 'Arial', sans-serif;
            line-height: 1.9;
            font-size: 1rem;
            color: #d4c4a8;
            font-weight: 400;
            letter-spacing: 0.01em;
        }
        .glava-text strong {
            color: #e0b68a;
            font-weight: 600;
        }
        .glava-text em {
            color: #c69c6d;
            font-style: italic;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.1rem;
            color: #b58c62;
            font-weight: 500;
            letter-spacing: 0.05em;
        }
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
        .error {
            text-align: center;
            padding: 40px;
            color: #e06060;
            background: rgba(224, 96, 96, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(224, 96, 96, 0.2);
        }
        .error h3 {
            font-family: 'Rubik Mono One', monospace;
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #e06060;
        }
        .error p {
            color: #d4c4a8;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .footer {
            text-align: center;
            padding: 0;
            margin: 20px 15px;
            border-radius: 16px;
            background: linear-gradient(145deg, #0d1f30, #1a3045);
            border: 1px solid rgba(159, 107, 58, 0.35);
            box-shadow: 0 8px 32px rgba(159, 107, 58, 0.2), inset 0 1px 0 rgba(159, 107, 58, 0.15);
            overflow: hidden;
        }
        .footer-inner {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.8rem 1.8rem;
            padding: 1.8rem 2rem;
            background: rgba(10, 26, 43, 0.4);
            backdrop-filter: blur(2px);
        }
        .footer-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 0.5rem;
        }
        .footer-brand .brand-name {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c69c6d, #e0b68a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.05em;
        }
        .footer-brand .brand-sub {
            font-size: 0.7rem;
            color: #a8855e;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.7;
            font-weight: 500;
        }
        .footer-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.5rem 1.4rem;
            padding: 0.5rem 1.4rem;
            background: rgba(159, 107, 58, 0.08);
            border-radius: 50px;
            border: 1px solid rgba(159, 107, 58, 0.15);
        }
        .footer-nav a {
            color: #b58c62;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.3rem 0.1rem;
            border-bottom: 2px solid transparent;
            transition: all 0.25s ease;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        .footer-nav a:hover {
            color: #e0b68a;
            border-bottom-color: #9f6b3a;
            transform: translateY(-1px);
            text-shadow: 0 0 12px rgba(159, 107, 58, 0.3);
        }
        .footer-copy {
            text-align: center;
            padding: 0.9rem 1rem 0.7rem;
            border-top: 1px solid rgba(159, 107, 58, 0.12);
            font-size: 0.75rem;
            color: #7a5f3e;
            letter-spacing: 0.05em;
            background: rgba(10, 26, 43, 0.3);
            font-weight: 400;
        }
        .footer-copy span {
            color: #a8855e;
        }
        @media (max-width: 700px) {
            .footer-inner {
                flex-direction: column;
                gap: 0.8rem;
                padding: 1.2rem 1rem;
            }
            .footer-brand {
                margin-right: 0;
            }
            .footer-nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.4rem 1rem;
                padding: 0.5rem 1rem;
                border-radius: 30px;
                width: 100%;
            }
            .footer-nav a {
                font-size: 0.9rem;
                white-space: nowrap;
            }
            .footer-copy {
                font-size: 0.65rem;
                padding: 0.6rem 0.5rem 0.5rem;
            }
        }
        @media (max-width: 450px) {
            .footer-nav a {
                font-size: 0.8rem;
            }
            .epoha {
                font-size: 1.6rem;
            }
            .glava-container {
                padding: 16px 18px;
            }
            .glava-title {
                font-size: 1rem;
            }
            .glava-text {
                font-size: 0.9rem;
                line-height: 1.7;
            }
        }
        .footer p {
            display: none;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-btn">Главная</a>
            <a href="online.html" class="nav-btn">Онлайн</a>
            <a href="gallery.html" class="nav-btn">Фотогаллерея</a>
            <a href="history.html" class="nav-btn active">История</a>
        </div>
    </div>
    <h1 style="text-align:center; font-family: 'Rubik Mono One', monospace; margin-top: 12px; margin-bottom: 8px; color: #e8d5b5; font-size: clamp(1.4rem, 4vw, 2.2rem); letter-spacing: 0.03em;">Повесть временных <span style="color:#c69c6d; font-family: 'Rubik Mono One', monospace;">безумий</span></h1>  
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="loading" style="padding: 20px; font-size: 14px;">Загрузка...</div>
        </div>
        <div class="content" id="content">
            <div class="loading">Загрузка истории</div>
        </div>
    </div>
    <div class="footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <span class="brand-name">FREEDOM</span>
                <span class="brand-sub">фан-сайт</span>
            </div>
            
            <nav class="footer-nav">
                <a href="https://fdm.su/">Официальный сайт</a>
                <a href="https://fdm.trademc.org/">Зеркало</a>
                <a href="https://max.ru/join/rmM-n0uWRx37Mi2OF-lM5UXaVCfybX5Fp4UwGACc3N4">Макс</a>
                <a href="https://vk.ru/fd_minec">ВК</a>
                <a href="https://t.me/addlist/rKuMRWEkqtU5Y2Iy">Telegram</a>
                <a href="https://discord.gg/GQrUQKW4xa">Discord</a>
                <a href="https://t.me/funfreedomnews">ТГК</a>
                <a href="https://github.com/freedom-fun/fun-site">GitHub</a>
            </nav>
        </div>
        <div class="footer-copy">
            <span>by kiman</span>
        </div>
    </div>

    <script>
        let historyData = [];

        async function loadHistory() {
            try {
                const response = await fetch('history.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                historyData = await response.json();
                if (!Array.isArray(historyData)) throw new Error('Данные не являются массивом');
                
                const epohas = [...new Set(historyData.map(item => item.epoha))];
                epohas.sort((a, b) => parseInt(a) - parseInt(b));
                
                renderSidebar(epohas);
                renderContent(epohas);
                
                if (epohas.length > 0) {
                    switchTab(epohas[0]);
                }
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('sidebar').innerHTML = '<div class="error">Ошибка загрузки history.json</div>';
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <h3>❌ Не удалось загрузить history.json</h3>
                        <p>Убедитесь, что файл находится в той же папке и имеет правильный формат.</p>
                        <p style="margin-top: 8px; font-size: 0.85rem; opacity: 0.7;">Детали: ${error.message}</p>
                    </div>
                `;
            }
        }

        function renderSidebar(epohas) {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';
            
            epohas.forEach(epoha => {
                const button = document.createElement('button');
                button.className = 'tab-button';
                button.setAttribute('data-tab', epoha);
                button.textContent = epoha === '0' ? '0' : epoha;
                button.title = `Эпоха ${epoha}`;
                
                button.addEventListener('click', function() {
                    switchTab(epoha);
                });
                
                sidebar.appendChild(button);
            });
        }

        function renderContent(epohas) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '';
            
            epohas.forEach(epoha => {
                const tabDiv = document.createElement('div');
                tabDiv.className = 'tab-content';
                tabDiv.id = epoha;
                
                const glavyForEpoha = historyData.filter(item => item.epoha === epoha);
                glavyForEpoha.sort((a, b) => parseInt(a.glava) - parseInt(b.glava));
                
                const epohaNames = {
                    '0': ['Эпоха нулевая', 'До нашей эры'],
                    '1': ['Эпоха первая', 'До бедрожье'],
                    '2': ['Эпоха вторая', 'Расцвет'],
                    '3': ['Эпоха третья', 'Испытания'],
                    '4': ['Эпоха четвертая', 'Перемены'],
                    '5': ['Эпоха пятая', 'Восстание'],
                    '6': ['Эпоха шестая', 'Возрождение'],
                    '7': ['Эпоха седьмая', 'Единство'],
                    '8': ['Эпоха восьмая', 'Новый путь'],
                    '9': ['Эпоха девятая', 'Финал']
                };
                
                const [epohaTitle, epohaSubtitle] = epohaNames[epoha] || [`Эпоха ${epoha}`, 'Исторический период'];
                
                const titleHTML = `
                    <h2 class="epoha">${epohaTitle}</h2>
                    <h3 class="name_epoha">${epohaSubtitle}</h3>
                `;
                tabDiv.innerHTML = titleHTML;
                
                glavyForEpoha.forEach(glavaItem => {
                    const glavaDiv = document.createElement('div');
                    glavaDiv.className = 'glava-container';
                    glavaDiv.innerHTML = `
                        <div class="glava-title">Глава ${glavaItem.glava}</div>
                        <div class="glava-text">${glavaItem.text}</div>
                    `;
                    tabDiv.appendChild(glavaDiv);
                });
                
                contentDiv.appendChild(tabDiv);
            });
        }

        function switchTab(tabId) {
            const buttons = document.querySelectorAll('.tab-button');
            const contents = document.querySelectorAll('.tab-content');
            
            contents.forEach(content => content.classList.remove('active'));
            buttons.forEach(button => button.classList.remove('active'));
            
            const activeContent = document.getElementById(tabId);
            if (activeContent) activeContent.classList.add('active');
            
            const activeButton = document.querySelector(`.tab-button[data-tab="${tabId}"]`);
            if (activeButton) activeButton.classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
</body>
</html>
